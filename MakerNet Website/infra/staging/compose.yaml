name: makernet-staging

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: makernet
      POSTGRES_USER: makernet
      POSTGRES_PASSWORD: ${STAGING_DB_PASSWORD:?Run npm run staging:env first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U makernet -d makernet"]
      interval: 5s
      timeout: 3s
      retries: 10

  object-storage:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${STAGING_STORAGE_USER:?Run npm run staging:env first}
      MINIO_ROOT_PASSWORD: ${STAGING_STORAGE_PASSWORD:?Run npm run staging:env first}
    volumes:
      - object_data:/data

  mail:
    image: axllent/mailpit:latest

  migrate:
    build:
      context: ../..
      dockerfile: infra/staging/Dockerfile
      target: source
    command: ["npm", "run", "db:migrate"]
    environment:
      DATABASE_URL: postgresql://makernet:${STAGING_DB_PASSWORD:?Run npm run staging:env first}@postgres:5432/makernet
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ../..
      dockerfile: infra/staging/Dockerfile
    environment:
      APP_ENV: staging
      DATABASE_URL: postgresql://makernet:${STAGING_DB_PASSWORD:?Run npm run staging:env first}@postgres:5432/makernet
      OBJECT_STORAGE_ENDPOINT: http://object-storage:9000
      OBJECT_STORAGE_ACCESS_KEY: ${STAGING_STORAGE_USER:?Run npm run staging:env first}
      OBJECT_STORAGE_SECRET_KEY: ${STAGING_STORAGE_PASSWORD:?Run npm run staging:env first}
      SMTP_URL: smtp://mail:1025
      APP_VERSION: ${APP_VERSION:?Run npm run staging:env first}
      BUILD_COMMIT: ${BUILD_COMMIT:?Run npm run staging:env first}
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      object-storage:
        condition: service_started
      mail:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 12

volumes:
  postgres_data:
  object_data:
