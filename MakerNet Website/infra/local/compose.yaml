services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: makernet
      POSTGRES_USER: makernet
      POSTGRES_PASSWORD: makernet
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U makernet -d makernet"]
      interval: 5s
      timeout: 3s
      retries: 10

  object-storage:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: local-access
      MINIO_ROOT_PASSWORD: local-secret
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - object_data:/data

  mail:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  postgres_data:
  object_data:
